services:
  - type: web
    name: node-mesh-aegis
    env: node
    rootDir: server
    plan: free
    buildCommand: npm ci || npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

  - type: static
    name: node-mesh-aegis-frontend
    rootDir: .
    buildCommand: rm -rf web/node_modules && npm --prefix web install && npm --prefix web run build
    staticPublishPath: web/dist
    autoDeploy: true
    rewrites:
      - source: /*
        destination: /index.html
    envVars:
      - key: VITE_WS_URL
        value: wss://node-mesh-aegis.onrender.com/ws
