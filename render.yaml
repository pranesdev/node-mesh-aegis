services:
  - type: web
    name: node-mesh-aegis
    env: node
    rootDir: server
    plan: free
    # Inside rootDir=server, npm resolves server/package.json + server/package-lock.json.
    buildCommand: npm ci || npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Set FRONTEND_URL to the production frontend origin (e.g. https://node-mesh-aegis.vercel.app).
      # Use FRONTEND_URL_EXTRA for a comma-separated list of additional allowed origins.
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_URL_EXTRA
        sync: false
